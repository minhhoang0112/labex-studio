="400">Tên thực tế có thể khác corp.local.</text><text x="365" y="436" font-size="17" fill="#2563eb" font-weight="600">Builtin / Computers / Users</text><text x="365" y="465" font-size="16" fill="#475569" font-weight="400">là các container có sẵn.</text>
