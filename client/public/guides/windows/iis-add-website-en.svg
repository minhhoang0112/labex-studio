<svg xmlns="http://www.w3.org/2000/svg" width="800" height="710" viewBox="0 0 800 710" role="img" aria-labelledby="title desc">
<title id="title">Configure the PortalCorp website</title><desc id="desc">Port 8080 avoids the Default Web Site binding on port 80.</desc>
<g font-family="Segoe UI, Arial, sans-serif">
<rect width="800" height="710" fill="#f8fafc"/>
<rect x="18" y="18" width="764" height="674" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<text x="42" y="59" font-size="25" fill="#0f172a" font-weight="700">Configure the PortalCorp website</text><text x="42" y="87" font-size="15" fill="#475569" font-weight="400">Port 8080 avoids the Default Web Site binding on port 80.</text>
<path d="M42 105 L758 105" fill="none" stroke="#e2e8f0" stroke-width="2"/><rect x="42" y="130" width="716" height="450" rx="5" fill="#ffffff" stroke="#cbd5e1"/><rect x="42" y="130" width="716" height="40" rx="5" fill="#eff6ff" stroke="#bfdbfe"/><text x="59" y="156" font-size="19" fill="#0f172a" font-weight="600">Add Website</text><text x="723" y="157" font-size="25" fill="#64748b" font-weight="400">×</text><circle cx="74" cy="210" r="15" fill="#2563eb"/><text x="68" y="216" font-size="18" fill="#ffffff" font-weight="700">1</text><text x="106" y="198" font-size="16" fill="#475569" font-weight="400">Site name:</text><rect x="106" y="208" width="586" height="39" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="119" y="234" font-size="20" fill="#0f172a" font-weight="600">PortalCorp</text><circle cx="74" cy="290" r="15" fill="#2563eb"/><text x="68" y="296" font-size="18" fill="#ffffff" font-weight="700">2</text><text x="106" y="278" font-size="16" fill="#475569" font-weight="400">Physical path:</text><rect x="106" y="288" width="586" height="39" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="119" y="314" font-size="20" fill="#0f172a" font-weight="600">C:\inetpub\wwwroot</text><circle cx="74" cy="370" r="15" fill="#2563eb"/><text x="68" y="376" font-size="18" fill="#ffffff" font-weight="700">3</text><text x="106" y="358" font-size="16" fill="#475569" font-weight="400">Binding:</text><rect x="106" y="368" width="586" height="39" rx="4" fill="#ffffff" stroke="#94a3b8"/><text x="119" y="394" font-size="20" fill="#0f172a" font-weight="600">Type: http   •   IP: All Unassigned   •   Port: 8080</text><text x="106" y="459" font-size="19" fill="#0f172a" font-weight="400">☑  Start Website immediately</text><rect x="578" y="510" width="114" height="39" rx="5" fill="#2563eb" stroke="#2563eb"/><text x="619" y="537" font-size="20" fill="#ffffff" font-weight="600">OK</text><text x="42" y="625" font-size="20" fill="#2563eb" font-weight="600">Test inside the VM: http://localhost:8080</text>
<text x="42" y="675" font-size="12" fill="#64748b" font-weight="400">Illustration • Not a VM screenshot • Example domain names</text>
</g></svg>